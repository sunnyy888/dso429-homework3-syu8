name: Answer quiz rounds
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: quiz
  cancel-in-progress: false
jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Answer new rounds and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "sunnyy888"
          git config user.email "sunnyy@usc.edu"
          python3 run.py
